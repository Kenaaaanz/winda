services:
  - type: web
    name: winda
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn winda.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: winda.settings_production
      - key: DEBUG
        value: false
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: SECURE_PROXY_SSL_HEADER
        value: HTTP_X_FORWARDED_PROTO,https
      - key: DATABASE_URL
        fromDatabase:
          name: winda_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: winda.africa,www.winda.africa

  - type: redis
    name: redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: winda_db
    databaseName: winda
    user: winda_user
    plan: free